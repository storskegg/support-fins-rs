<h1>Honest limitations</h1>
<ul>
<li>Overhangs sitting over the <em>part</em> rather than the plate aren't handled — fins attach to the bed only.</li>
<li>Features shorter than roughly a 4 mm wall height are too short for a real fin.</li>
<li>It won't pick your orientation for you. On purpose.</li>
</ul>
