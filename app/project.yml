# The source of truth for the Xcode project (`just app-project` generates app/SupportFins.xcodeproj, which is
# git-ignored). The viewer and SupportFinsCore (track D, `just app-core` builds its XCFramework) are local packages.
name: SupportFins
# MARKETING_VERSION: generated from web/changelog.json (tools/whatsnew/gen.js)
configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig
options:
  bundleIdPrefix: com.storskegg
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64            # this Mac only: the XCFramework is aarch64-apple-darwin
    ONLY_ACTIVE_ARCH: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    # an archive strips the installed product (STRIP_STYLE all drops local symbols, which is every Rust function): keep them, so a
    # crash report's backtrace names the engine's frames (docs/FFI.md "Crash reports")
    STRIP_STYLE: debugging
packages:
  Viewer:
    path: SupportFinsViewer
  SupportFinsCore:
    path: SupportFinsCore
targets:
  SupportFins:
    type: application
    platform: macOS
    sources:
      - path: SupportFins
        excludes:
          - Help
          - Resources/Calibration
      # the StepReader service's protocol (X-01)
      - path: Shared
      # the Help Book (built from the web's pages by tools/helpbook), kept whole: the Help Viewer reads the folder as is
      - path: SupportFins/Help/SupportFins.help
        type: folder
      # the test prints and their estimates (web/calibration/), kept as a folder: file names stay as the page serves them
      - path: SupportFins/Resources/Calibration
        type: folder
    dependencies:
      - package: Viewer
        product: Viewer
      - package: SupportFinsCore
        product: SupportFinsCore
      # embedded in Contents/XPCServices: STEP is read there, never in the app (X-01)
      - target: StepReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.storskegg.SupportFins
        PRODUCT_NAME: Support Fins
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Support Fins
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_NSHumanReadableCopyright: MIT
        ENABLE_HARDENED_RUNTIME: YES
        # the compiler lists the strings the code localizes (.stringsdata): tools/i18n/parity.ts reads them
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: SupportFins/SupportFins.entitlements
    info:
      path: SupportFins/Info.plist
      properties:
        CFBundleHelpBookFolder: SupportFins.help
        CFBundleHelpBookName: com.storskegg.SupportFins.help
        CFBundleDocumentTypes:
          - CFBundleTypeName: STL model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.standard-tesselated-geometry-format]
          - CFBundleTypeName: OBJ model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.geometry-definition-format]
          - CFBundleTypeName: 3MF model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.storskegg.supportfins.3mf]
            CFBundleTypeExtensions: ["3mf"]
          - CFBundleTypeName: STEP model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.storskegg.supportfins.step]
            CFBundleTypeExtensions: ["step", "stp"]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.storskegg.supportfins.3mf
            UTTypeDescription: 3MF model
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: ["3mf"]
              public.mime-type: ["model/3mf"]
          - UTTypeIdentifier: com.storskegg.supportfins.step
            UTTypeDescription: STEP model
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: ["step", "stp"]
              public.mime-type: ["model/step"]
  # The STEP reader (X-01), out of the app's process: this XPC service (sandboxed, no other entitlement) starts a
  # `step-read` (below) per file and kills it when the app stops waiting. It does not link OpenCascade itself.
  StepReader:
    type: xpc-service
    platform: macOS
    sources:
      - path: StepReader
      - path: Shared
    dependencies:
      # in Contents/MacOS; signed below
      - target: StepRead
        embed: true
        codeSign: false
        copy:
          destination: executables
    # step-read must carry exactly app-sandbox + inherit: a sandbox-inheriting child with any other entitlement traps in its
    # sandbox setup at launch (a crash report each time). Xcode's own signing adds get-task-allow, and test-runner exceptions
    # when building for testing, so it is signed here; then the service's bundle is signed again over it, keeping its own
    # entitlements and flags.
    postBuildScripts:
      - name: Sign step-read
        basedOnDependencyAnalysis: false
        script: |
          set -e
          id="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          codesign --force --sign "$id" --options runtime --timestamp=none \
            --entitlements "${SRCROOT}/StepRead/step-read.entitlements" "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/step-read"
          codesign --force --sign "$id" --timestamp=none --preserve-metadata=identifier,entitlements,flags \
            "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.storskegg.SupportFins.StepReader
        PRODUCT_NAME: StepReader
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: StepReader/StepReader.entitlements
        # the Sign step-read script writes into the bundle
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: StepReader/Info.plist
      properties:
        CFBundleDisplayName: Support Fins STEP Reader
        XPCService:
          ServiceType: Application
  # One STEP read with OpenCascade (crates/sf-step-xpc, built by `just swift-bindings` into
  # StepRead/sf_step_xpc.xcframework, static): `step-read <file> <result>`, both in the service's temporary directory. A
  # fault ends it with an exit status (no crash report). Inherits the service's sandbox.
  StepRead:
    type: tool
    platform: macOS
    sources:
      - path: StepRead
        excludes:
          - "*.xcframework"
    dependencies:
      - framework: StepRead/sf_step_xpc.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: step-read
        PRODUCT_BUNDLE_IDENTIFIER: com.storskegg.SupportFins.StepReader.step-read
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: StepRead/step-read.entitlements
        # re-signed with exactly its entitlements by the StepReader target (Sign step-read)
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        DEAD_CODE_STRIPPING: YES
        SKIP_INSTALL: YES
        # OpenCascade and the shim are C++
        OTHER_LDFLAGS: ["-lc++"]
  SupportFinsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SupportFinsTests
      # StepReaderTests (X-01): the files that crashed the app, and the parity STEP fixtures (the test host is sandboxed:
      # it reads them from its bundle)
      - path: ../crates/sf-step-xpc/tests/segv
        type: folder
        buildPhase: resources
      - path: ../parity/step-fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: SupportFins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.storskegg.SupportFinsTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Support Fins.app/Contents/MacOS/Support Fins"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SupportFinsUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - SupportFinsUITests
      # StepImportUITests: a STEP file that crashed the app before X-01
      - path: ../crates/sf-step-xpc/tests/segv/step_segv_loft.step
        buildPhase: resources
    dependencies:
      - target: SupportFins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.storskegg.SupportFinsUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SupportFins
schemes:
  SupportFins:
    build:
      targets:
        SupportFins: all
    run:
      config: Debug
    test:
      config: Debug
      # the tests read the English strings; the localization tests pick the language they look at themselves
      language: en
      region: US
      targets: [SupportFinsTests]
    profile:
      config: Release
  # The UI tests drive the real window: `just app-uitest` (needs the Mac's Accessibility permission for Xcode's
  # test runner). They are not part of `just app-test`.
  SupportFinsUI:
    build:
      targets:
        SupportFins: all
    test:
      config: Debug
      language: en
      region: US
      targets: [SupportFinsUITests]
