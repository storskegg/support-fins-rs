[workspace]
resolver = "3"
members = ["crates/*", "parity"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
sf-engine = { path = "crates/sf-engine" }
sf-io = { path = "crates/sf-io" }
sf-testkit = { path = "crates/sf-testkit" }
libm = "0.2.16"
indexmap = "2.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
base64 = "0.22"
proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# A port keeps the JS's arithmetic shape; these lints would rewrite it.
suboptimal_flops = "allow"
manual_range_contains = "allow"
float_cmp = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"

[profile.test]
opt-level = 1
