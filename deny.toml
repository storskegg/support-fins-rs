# cargo-deny: `cargo deny check` (a step of `just gate`). The licence allow-list is what tools/licenses/gen.py also enforces
# for the crates that ship; keep the two in step. OpenCascade (LGPL-2.1) and Manifold (Apache-2.0) are C++, not crates, and are
# credited by tools/licenses (the app's Acknowledgements).

[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# a path dependency inside the workspace is not a wildcard
allow-wildcard-paths = true
deny = [
    # copyleft crates would put the app under that licence (the one LGPL piece is OpenCascade, linked on purpose)
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
# basic-toml is unmaintained and build-time only (audit X-14); nothing else is ignored
ignore = [
    { id = "RUSTSEC-2026-0374", reason = "basic-toml unmaintained: build time only (askama, in uniffi_bindgen), never in the app" },
]
