<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Port Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c2026; --muted: #6b7280; --line: #e3e6ea;
    --done: #2f9e6b; --active: #3a7bd5; --todo: #c4c9d1; --warn: #d98a1c; --bad: #d9473a;
    --busy-bg: #e7f0fc; --warn-bg: #fdf3e3; --idle-bg: #eef0f3;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --card: #1b1e23; --ink: #e8eaed; --muted: #9aa1ab; --line: #2b3038;
      --done: #3fbf86; --active: #5b9cf0; --todo: #3a4049; --warn: #e6a23c; --bad: #ef6b5e;
      --busy-bg: #18263a; --warn-bg: #33281a; --idle-bg: #22262c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .sub { color: var(--muted); font-size: 12px; }
  .verdict { border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; font-weight: 600; }
  .verdict.busy { background: var(--busy-bg); }
  .verdict.warn { background: var(--warn-bg); }
  .verdict.idle { background: var(--idle-bg); }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .busy .dot { background: var(--active); animation: pulse 1.4s infinite; }
  .warn .dot { background: var(--warn); }
  .idle .dot { background: var(--todo); }
  @keyframes pulse { 50% { opacity: .35; } }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .span12 { grid-column: span 12; } .span8 { grid-column: span 8; } .span6 { grid-column: span 6; } .span4 { grid-column: span 4; }
  @media (max-width: 900px) { .span8, .span6, .span4 { grid-column: span 12; } }
  .milestones { display: flex; gap: 4px; }
  .ms { flex: 1; min-width: 0; }
  .ms .bar { height: 10px; border-radius: 5px; background: var(--todo); overflow: hidden; }
  .ms .fill { height: 100%; background: var(--active); }
  .ms.done .bar { background: var(--done); }
  .ms .lab { font-size: 12px; font-weight: 600; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ms .lab small { display: block; font-weight: 400; color: var(--muted); }
  .ms.active .lab { color: var(--active); }
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }
  .col h3 { font-size: 12px; margin: 0 0 8px; display: flex; gap: 6px; align-items: center; }
  .col h3 .n { color: var(--muted); font-weight: 400; }
  .pill { width: 8px; height: 8px; border-radius: 50%; }
  ul.tasks { list-style: none; margin: 0; padding: 0; }
  ul.tasks li { padding: 6px 8px; border-radius: 6px; margin-bottom: 4px; background: var(--bg); font-size: 13px; }
  ul.tasks li.cur { outline: 1.5px solid var(--active); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .trunc { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scroll { overflow-x: auto; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--bg); color: var(--muted); }
  .tag.run { background: var(--busy-bg); color: var(--active); }
  .tag.quiet { background: var(--warn-bg); color: var(--warn); }
  .tag.done { color: var(--done); }
  svg { display: block; width: 100%; height: 120px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 4px; }
  .err { color: var(--bad); }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Support Fins port</h1>
    <span class="sub" id="updated">loading…</span>
  </header>

  <div class="verdict idle" id="verdict"><span class="dot"></span><span id="verdict-text">Loading…</span></div>

  <div class="grid">
    <section class="card span12">
      <h2>Milestones</h2>
      <div class="milestones" id="milestones"></div>
      <div class="sub" id="ms-note" style="margin-top:10px"></div>
    </section>

    <section class="card span8">
      <h2>Tasks</h2>
      <div class="cols" id="tasks"></div>
    </section>

    <section class="card span4">
      <h2>Machine load (2 h)</h2>
      <svg id="chart" viewBox="0 0 400 120" preserveAspectRatio="none"></svg>
      <div class="legend"><span><i style="background:var(--active)"></i>load (1 min) vs cores</span><span><i style="background:var(--warn)"></i>build/test CPU</span></div>
      <div class="sub" id="loadnow" style="margin-top:6px"></div>
    </section>

    <section class="card span6">
      <h2>Background agents</h2>
      <div class="scroll"><table id="agents"></table></div>
    </section>

    <section class="card span6">
      <h2>Worktree activity</h2>
      <div class="scroll"><table id="worktrees"></table></div>
    </section>

    <section class="card span12">
      <h2>Build, test and bench processes</h2>
      <div class="scroll"><table id="procs"></table></div>
    </section>

    <section class="card span6">
      <h2>Open pull requests</h2>
      <div class="scroll"><table id="prs"></table></div>
    </section>

    <section class="card span6">
      <h2>Recent commits on main</h2>
      <div class="scroll"><table id="commits"></table></div>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ago(sec) {
  if (sec == null) return "—";
  sec = Math.max(0, sec);
  if (sec < 60) return Math.round(sec) + " s";
  if (sec < 3600) return Math.round(sec / 60) + " min";
  if (sec < 86400) return (sec / 3600).toFixed(1) + " h";
  return (sec / 86400).toFixed(1) + " d";
}
function dur(sec) { return ago(sec); }

function renderMilestones(plan) {
  const ms = plan.milestones || [];
  $("milestones").innerHTML = ms.map(m => {
    const pct = m.status === "done" ? 100 : (m.progress ?? 0);
    return `<div class="ms ${esc(m.status)}" title="${esc(m.name)}">
      <div class="bar">${m.status === "active" ? `<div class="fill" style="width:${pct}%"></div>` : ""}</div>
      <div class="lab">${esc(m.id)}<small>${esc(m.name)}${m.status === "active" ? " · " + pct + "%" : ""}</small></div></div>`;
  }).join("");
  const done = ms.filter(m => m.status === "done").length;
  $("ms-note").textContent = `${done} of ${ms.length} milestones done` + (plan.current ? ` · now: ${plan.current}` : "");
}

function renderTasks(plan) {
  const t = plan.tasks || {};
  const col = (title, color, items, cls) => `<div class="col"><h3><span class="pill" style="background:${color}"></span>${title} <span class="n">${(items||[]).length}</span></h3>
    <ul class="tasks">${(items||[]).map(x => `<li class="${cls}">${esc(x)}</li>`).join("") || '<li class="empty">none</li>'}</ul></div>`;
  $("tasks").innerHTML = col("In progress", "var(--active)", t.in_progress, "cur")
    + col("To do", "var(--todo)", t.todo, "") + col("Done", "var(--done)", t.done, "");
}

function renderAgents(plan, wts) {
  const ag = plan.agents || [];
  if (!ag.length) { $("agents").innerHTML = '<tr><td class="empty">No background agents.</td></tr>'; return; }
  const byName = Object.fromEntries((wts || []).map(w => [w.name, w]));
  $("agents").innerHTML = "<tr><th>Agent</th><th>Working on</th><th>Started</th><th>Last write</th><th>Status</th></tr>" +
    ag.map(a => {
      const w = (a.worktrees || []).map(n => byName[n]).filter(Boolean);
      const lastWrite = w.length ? Math.min(...w.map(x => x.last_write_ago ?? Infinity)) : null;
      const cpu = w.reduce((s, x) => s + x.cpu, 0);
      let tag = `<span class="tag">${esc(a.status)}</span>`;
      if (a.status === "running") {
        const active = cpu > 5 || (lastWrite != null && lastWrite < 300);
        tag = active ? '<span class="tag run">active</span>' : '<span class="tag quiet">quiet</span>';
      } else if (a.status === "done") tag = '<span class="tag done">done</span>';
      const started = a.started ? ago(Date.now() / 1000 - Date.parse(a.started) / 1000) + " ago" : "—";
      return `<tr><td>${esc(a.name)}</td><td>${esc(a.task)}</td><td class="num">${started}</td>
        <td class="num">${lastWrite == null || lastWrite === Infinity ? "—" : ago(lastWrite) + " ago"}</td><td>${tag}</td></tr>`;
    }).join("");
}

function renderWorktrees(wts) {
  if (!wts.length) { $("worktrees").innerHTML = '<tr><td class="empty">No worktree active in the last hour.</td></tr>'; return; }
  $("worktrees").innerHTML = "<tr><th>Worktree</th><th>Branch</th><th>Edited (15 min / all)</th><th>Last write</th><th>CPU</th><th>Last commit</th></tr>" +
    wts.slice(0, 15).map(w => `<tr><td class="mono">${esc(w.name)}</td><td class="mono">${esc(w.branch)}</td>
      <td class="num">${w.files_15m} / ${w.edited}</td><td class="num">${w.last_write_ago == null ? "—" : ago(w.last_write_ago) + " ago"}</td>
      <td class="num">${w.cpu ? w.cpu + "%" : "—"}</td>
      <td class="trunc" title="${esc(w.last_commit)}">${w.last_commit_ago == null ? "" : ago(w.last_commit_ago) + " · "}${esc(w.last_commit)}</td></tr>`).join("");
}

function renderProcs(ps) {
  if (!ps.length) { $("procs").innerHTML = '<tr><td class="empty">No build, test or bench process running.</td></tr>'; return; }
  $("procs").innerHTML = "<tr><th>Process</th><th>Worktree</th><th>CPU</th><th>Memory</th><th>Running for</th><th>Command</th></tr>" +
    ps.map(p => `<tr><td class="mono">${esc(p.exe)}</td><td class="mono">${esc(p.worktree)}</td>
      <td class="num">${p.cpu.toFixed(0)}%</td><td class="num">${p.rss_mb} MB</td><td class="num">${dur(p.elapsed)}</td>
      <td class="mono trunc" title="${esc(p.cmd)}">${esc(p.cmd)}</td></tr>`).join("");
}

function renderPRs(prs) {
  if (!prs.length) { $("prs").innerHTML = '<tr><td class="empty">No open pull requests.</td></tr>'; return; }
  $("prs").innerHTML = "<tr><th>#</th><th>Title</th><th>State</th><th>Updated</th></tr>" +
    prs.map(p => `<tr><td class="num">${p.number}</td><td class="trunc" title="${esc(p.title)}">${esc(p.title)}</td>
      <td><span class="tag">${esc((p.mergeable || "").toLowerCase())}</span></td>
      <td class="num">${ago(Date.now() / 1000 - Date.parse(p.updatedAt) / 1000)} ago</td></tr>`).join("");
}

function renderCommits(cs, now) {
  $("commits").innerHTML = cs.map(c => `<tr><td class="mono">${esc(c.hash)}</td><td class="trunc" title="${esc(c.subject)}">${esc(c.subject)}</td>
    <td class="num">${ago(now - c.time)} ago</td></tr>`).join("") || '<tr><td class="empty">—</td></tr>';
}

function renderChart(hist, cores) {
  const W = 400, H = 120, now = Date.now() / 1000, span = 7200;
  const x = t => W - (now - t) / span * W;
  const maxLoad = Math.max(cores, ...hist.map(h => h[1]), 1);
  const maxCpu = Math.max(cores * 100, ...hist.map(h => h[2]), 100);
  const line = (k, max) => hist.map((h, i) => `${i ? "L" : "M"}${x(h[0]).toFixed(1)},${(H - h[k] / max * (H - 6) - 3).toFixed(1)}`).join("");
  const coreY = H - cores / maxLoad * (H - 6) - 3;
  $("chart").innerHTML = `
    <line x1="0" x2="${W}" y1="${coreY}" y2="${coreY}" stroke="var(--line)" stroke-dasharray="4 4"/>
    <text x="4" y="${coreY - 3}" font-size="10" fill="var(--muted)">${cores} cores</text>
    ${hist.length > 1 ? `<path d="${line(2, maxCpu)}" fill="none" stroke="var(--warn)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    <path d="${line(1, maxLoad)}" fill="none" stroke="var(--active)" stroke-width="2" vector-effect="non-scaling-stroke"/>` :
    `<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="11" fill="var(--muted)">collecting samples…</text>`}`;
}

function render(s) {
  try {
    const plan = s.plan || {};
    $("verdict").className = "verdict " + s.verdict.level;
    $("verdict-text").textContent = s.verdict.text;
    $("updated").textContent = `live · refreshed ${new Date().toLocaleTimeString()} · plan updated ${ago(plan.state_age)} ago`;
    if (plan.error) $("ms-note").innerHTML = `<span class="err">${esc(plan.error)}</span>`;
    renderMilestones(plan); renderTasks(plan); renderAgents(plan, s.worktrees);
    renderWorktrees(s.worktrees); renderProcs(s.processes); renderPRs(s.prs); renderCommits(s.commits, s.now);
    renderChart(s.history, s.load.cores);
    $("loadnow").textContent = `now: load ${s.load.one.toFixed(1)} / ${s.load.five.toFixed(1)} / ${s.load.fifteen.toFixed(1)} on ${s.load.cores} cores`;
  } catch (e) {
    $("verdict").className = "verdict warn";
    $("verdict-text").textContent = "Dashboard render failed: " + e;
  }
}
// live: the server pushes state every 2 s; EventSource reconnects by itself if the server restarts
const stream = new EventSource("/api/stream");
stream.onmessage = ev => render(JSON.parse(ev.data));
stream.onerror = () => {
  $("verdict").className = "verdict warn";
  $("verdict-text").textContent = "Dashboard server not responding: reconnecting…";
};
</script>
</body>
</html>
