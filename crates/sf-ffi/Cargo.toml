[package]
name = "sf-ffi"
description = "The Swift <-> Rust interface (UniFFI), docs/FFI.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "lib"]

[features]
# the app's static library installs `BigBlocks` as its global allocator (C-05); tests and probes do not
app-alloc = []

[dependencies]
sf-engine.workspace = true
sf-io.workspace = true
sf-cut.workspace = true
# without OpenCascade (sf-step's `occt` feature, through sf-cli's): the app reads STEP out of process (StepReader XPC service)
sf-cli = { workspace = true, default-features = false }
sf-step = { workspace = true, default-features = false }
serde_json.workspace = true
rustc-demangle.workspace = true
# no `cli`/`bindgen`: the generator is the sf-bindgen crate (X-14), so the library does not build uniffi_bindgen and its parsers
uniffi = { workspace = true, default-features = false }

[dev-dependencies]
# the tests compare load_step_parts with load_parts reading STEP in process, which needs OpenCascade
sf-step.workspace = true
sf-testkit.workspace = true
parity = { path = "../../parity" }

[lints]
workspace = true
