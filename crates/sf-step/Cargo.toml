[package]
name = "sf-step"
description = "STEP import through native OpenCascade 7.6.1 (port of web/step.js; the kernel is occt-import-js 0.0.23's, built natively)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = ["occt"]
# Link OpenCascade (build.rs) and run the kernel in this process. Off in the app's engine (sf-ffi): the app reads STEP
# out of process (step-read, crates/sf-step-xpc), and keeps `is_step`, `step_objects` and `wire`.
occt = ["dep:libc"]

[dependencies]
sf-engine.workspace = true
libc = { workspace = true, optional = true }

[build-dependencies]
cc.workspace = true

[dev-dependencies]
parity = { path = "../../parity" }
sf-testkit.workspace = true


[lints]
workspace = true
