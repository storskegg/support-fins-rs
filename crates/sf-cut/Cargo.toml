[package]
name = "sf-cut"
description = "Manifold 3.5.4 boolean bridge and the port of web/cut.js (a slicer's negative parts, cut out of the part)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
sf-engine.workspace = true
sf-io.workspace = true
indexmap.workspace = true

[build-dependencies]
# Exact on purpose: Manifold's build is part of parity (the cut's floats, and so the bench_m5 hashes), so a cc that
# changed its compiler flags would be a parity change. Bump it deliberately, with the hashes. (The workspace's
# `cc = "1.2"` resolves to this same 1.8.0: one cc in Cargo.lock.)
cc = "=1.8.0"

[dev-dependencies]
sf-testkit.workspace = true
parity = { path = "../../parity" }

[lints]
workspace = true
