[package]
name = "sf-cli"
description = "The `support-fins` command line (port of plugins/cli)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "support-fins"
path = "src/main.rs"

[features]
default = ["occt"]
# STEP through OpenCascade, in this process (a crash ends only the CLI). Off in the app's engine (sf-ffi).
occt = ["sf-step/occt"]

[dependencies]
sf-engine.workspace = true
sf-io.workspace = true
sf-cut.workspace = true
sf-step = { workspace = true, default-features = false }
indexmap.workspace = true

[dev-dependencies]
sf-testkit.workspace = true
miniz_oxide.workspace = true

[lints]
workspace = true
